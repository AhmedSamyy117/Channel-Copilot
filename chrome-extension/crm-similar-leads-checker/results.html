<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Similar Leads — Full Results</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 24px; color: #1f2430; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  #subtitle { color: #666; font-size: 13px; margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e5e5e5; font-size: 13px; vertical-align: top; }
  th { background: #f6f7f8; position: sticky; top: 0; }
  tr:hover { background: #fafafa; }
  .name a { color: #714b67; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .count { font-weight: 600; white-space: nowrap; }
  .breakdown { color: #555; }
  .empty { color: #888; padding: 24px; }
  label.toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; margin-bottom: 12px; cursor: pointer; }
</style>
</head>
<body>
  <h1>Similar Leads — Full Results</h1>
  <div id="subtitle"></div>
  <label class="toggle"><input type="checkbox" id="excludeLostToggle" /> Exclude Lost from counts</label>
  <div id="content"></div>
  <script src="results.js"></script>
</body>
</html>
