<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Channel Copilot</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    color: #1f2430;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 12px;
  }
  .field {
    margin-bottom: 8px;
  }
  .field .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6b7280;
  }
  .field .value {
    font-size: 13px;
    word-break: break-word;
  }
  .editable {
    margin-bottom: 10px;
  }
  .editable label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6b7280;
    margin-bottom: 3px;
  }
  .editable input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    font-size: 13px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
  }
  .hint {
    font-size: 11px;
    color: #6b7280;
    margin: -4px 0 12px;
  }
  button {
    width: 100%;
    padding: 8px 12px;
    margin: 12px 0;
    border: none;
    border-radius: 6px;
    background: #714b67;
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  button:disabled {
    background: #b8a7b3;
    cursor: default;
  }
  #status {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 8px;
  }
  #kycResult, #internalResult {
    white-space: pre-wrap;
    font-size: 13px;
    background: #f8f7f9;
    border: 1px solid #e5e2e6;
    border-radius: 6px;
    padding: 10px;
    display: none;
    margin-top: 10px;
  }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #6b7280;
    margin: 12px 0 4px;
  }
  #contactCard {
    display: none;
    font-size: 13px;
    background: #f8f7f9;
    border: 1px solid #e5e2e6;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  #contactCard .name {
    font-weight: 600;
  }
  #error {
    color: #b91c1c;
    font-size: 12px;
    display: none;
  }
  a { color: #714b67; }
</style>
</head>
<body>
  <h1>Channel Copilot</h1>
  <div id="status">Reading page…</div>
  <div class="editable">
    <label for="customerNameInput">Customer name</label>
    <input id="customerNameInput" type="text" placeholder="Not read from page — type it in" />
  </div>
  <div class="editable">
    <label for="customerCountryInput">Country</label>
    <input id="customerCountryInput" type="text" placeholder="Not read from page — type it in" />
  </div>
  <div class="hint" id="sourceHint">Extraction from Odoo is best-effort — check/fix these before researching.</div>
  <div class="editable" id="domainRow" style="display:none">
    <label for="domainInput">Domain (from contact record)</label>
    <input id="domainInput" type="text" placeholder="e.g. example.com" />
  </div>
  <div id="contactCard"></div>
  <div id="fields"></div>
  <button id="kycBtn" disabled>Research KYC</button>
  <div id="error"></div>
  <div id="kycResult"></div>
  <div id="internalResult"></div>
  <div style="margin-top:16px;font-size:11px;">
    <a id="optionsLink" href="#">API key settings</a>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
