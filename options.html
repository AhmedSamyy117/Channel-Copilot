<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Channel Copilot — Settings</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 420px;
    margin: 40px auto;
    color: #1f2430;
  }
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: #714b67;
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  #saved {
    font-size: 12px;
    color: #16a34a;
    margin-left: 10px;
    display: none;
  }
  p.hint {
    font-size: 12px;
    color: #6b7280;
  }
</style>
</head>
<body>
  <h2>Channel Copilot settings</h2>

  <label for="apiKey">Anthropic API key</label>
  <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
  <p class="hint">Stored locally in this browser only (chrome.storage.local). Never sent anywhere except api.anthropic.com.</p>

  <label for="model">Model (optional)</label>
  <input id="model" type="text" placeholder="claude-sonnet-5" />

  <button id="saveBtn">Save</button>
  <span id="saved">Saved</span>

  <script src="options.js"></script>
</body>
</html>
